spring.profiles.active=${APP_PROFILE:dev}

server.port=${APP_HTTP_PORT:18080}

# AI request parameters should be supplied by the integrating application
# through sql.sentry.ai.model / sql.sentry.ai.api-url / sql.sentry.ai.api-key.
# The server keeps only transport and generation fallback defaults here.
app.ai.connect-timeout-ms=${APP_AI_CONNECT_TIMEOUT_MS:15000}
app.ai.read-timeout-ms=${APP_AI_READ_TIMEOUT_MS:60000}
app.ai.write-timeout-ms=${APP_AI_WRITE_TIMEOUT_MS:15000}
app.ai.call-timeout-ms=${APP_AI_CALL_TIMEOUT_MS:65000}
app.ai.request-timeout-ms=${APP_AI_REQUEST_TIMEOUT_MS:65000}
app.ai.max-tokens=${APP_AI_MAX_TOKENS:1024}
app.ai.thinking-type=${APP_AI_THINKING_TYPE:disabled}

app.cache.local-ttl-seconds=${APP_CACHE_LOCAL_TTL_SECONDS:86400}
app.cache.max-entries=${APP_CACHE_MAX_ENTRIES:2048}
app.cache.redis.failure-threshold=${APP_REDIS_BREAKER_FAILURE_THRESHOLD:3}
app.cache.redis.open-window-ms=${APP_REDIS_BREAKER_OPEN_WINDOW_MS:30000}

app.sql-rewrite.cache-ttl-hours=${APP_SQL_REWRITE_CACHE_TTL_HOURS:24}
app.sql-rewrite.recent-list-limit=${APP_SQL_REWRITE_RECENT_LIST_LIMIT:512}
app.sql-rewrite.export-limit=${APP_SQL_REWRITE_EXPORT_LIMIT:512}

app.thread-pool.rule.core-size=${APP_RULE_POOL_CORE_SIZE:0}
app.thread-pool.rule.max-size=${APP_RULE_POOL_MAX_SIZE:0}
app.thread-pool.rule.queue-capacity=${APP_RULE_POOL_QUEUE_CAPACITY:0}
app.thread-pool.rule.keep-alive-seconds=${APP_RULE_POOL_KEEPALIVE_SECONDS:60}
app.thread-pool.llm.core-size=${APP_LLM_POOL_CORE_SIZE:0}
app.thread-pool.llm.max-size=${APP_LLM_POOL_MAX_SIZE:0}
app.thread-pool.llm.queue-capacity=${APP_LLM_POOL_QUEUE_CAPACITY:0}
app.thread-pool.llm.keep-alive-seconds=${APP_LLM_POOL_KEEPALIVE_SECONDS:60}
