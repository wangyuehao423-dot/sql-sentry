spring.datasource.url=jdbc:h2:mem:demo_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# Enables SQL Sentry in the demo application.
sql.sentry.enabled=true
# Enables slow-SQL reporting to the server.
sql.sentry.capture-enabled=true
# Enables local SQL rewrite lookup and application.
sql.sentry.rewrite-enabled=true
# Points to the sql-sentry-server instance.
sql.sentry.server-base-url=http://127.0.0.1:18080
# Slow-SQL threshold in milliseconds.
sql.sentry.slow-sql-threshold-ms=500
# Poll interval for approved rewrite mappings.
sql.sentry.pull-interval-ms=30000
# Logical source name reported with captures.
sql.sentry.source=demo-service
# Database name attached to captures.
sql.sentry.database=demo_db
# AI model name used for diagnostic requests.
sql.sentry.ai.model=${DEMO_SQL_SENTRY_AI_MODEL:}
# AI endpoint used for diagnostic requests.
sql.sentry.ai.api-url=${DEMO_SQL_SENTRY_AI_API_URL:}
# AI API key used for diagnostic requests.
sql.sentry.ai.api-key=${DEMO_SQL_SENTRY_AI_API_KEY:}
