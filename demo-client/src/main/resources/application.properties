spring.datasource.url=${DEMO_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/demo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DEMO_DATASOURCE_USERNAME:root}
spring.datasource.password=${DEMO_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# Enable SQL Sentry in the demo application.
sql.sentry.enabled=true

# Enable slow-SQL reporting to the server.
sql.sentry.capture-enabled=true

# Enable local SQL rewrite lookup and application.
sql.sentry.rewrite-enabled=true

# Server base URL is fixed inside the starter:
# http://175.178.42.12/sql-sentry
# Business applications do not need to configure sql.sentry.server-base-url.
sql.sentry.slow-sql-threshold-ms=0

# Poll interval for approved rewrite mappings.
sql.sentry.pull-interval-ms=5000

# Logical source name reported with captures.
sql.sentry.source=demo-service

# Database name attached to captures.
sql.sentry.database=demo_db

# AI model name used for diagnostic requests.
sql.sentry.ai.model=${SQL_SENTRY_AI_MODEL:kimi-k2.6}

# AI endpoint used for diagnostic requests.
sql.sentry.ai.api-url=${SQL_SENTRY_AI_API_URL:https://api.moonshot.cn/v1}

# AI API key used for diagnostic requests.
sql.sentry.ai.api-key=${SQL_SENTRY_AI_API_KEY:}