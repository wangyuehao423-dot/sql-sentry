name: Publish Starter

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-starter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish sql-sentry-spring-boot-starter
        run: mvn -B -pl sql-sentry-spring-boot-starter -am deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
